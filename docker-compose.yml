version: '3.8'
services:
  database:
    image: postgres:15-alpine
    container_name: ${DATABASE_HOST:-db_container}
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER:-myUser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-myPassword}
      POSTGRES_DB: ${DATABASE_NAME:-myPostgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-app_container}
    restart: always
    env_file:
      - .env
    depends_on:
      - database
    ports:
      - '4000:4000'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
